name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Prepare launcher icon + splash source images
        run: node scripts/prepare-android-assets.mjs

      - name: Generate Android launcher/adaptive/monochrome icons + splash
        run: |
          bunx @capacitor/assets generate --android \
            --iconBackgroundColor "#07050F" \
            --iconBackgroundColorDark "#07050F" \
            --splashBackgroundColor "#07050F" \
            --splashBackgroundColorDark "#07050F"

      - name: Patch AndroidManifest.xml (permissions + SMS query)
        run: |
          python3 scripts/patch-android-manifest.py

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vairagya-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
