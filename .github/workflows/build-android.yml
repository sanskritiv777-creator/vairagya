name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: |
           bun run build
           echo "--- Top-level dirs ---"
           ls -la
           echo "--- .output (if exists) ---"
           find .output -maxdepth 3 2>/dev/null || echo "(no .output dir)"
           echo "--- dist (if exists) ---"
           find dist -maxdepth 3 2>/dev/null || echo "(no dist dir)"
           echo "--- any index.html anywhere ---"
           find . -maxdepth 5 -iname "index.html" -not -path "*/node_modules/*" 2>/dev/null || echo "(none found)"


      - name: Debug - list build output
        run: |
          echo "--- Top-level dirs ---"
          ls -la
          echo "--- .output (if exists) ---"
          find .output -maxdepth 3 2>/dev/null || echo "(no .output dir)"
          echo "--- dist (if exists) ---"
          find dist -maxdepth 3 2>/dev/null || echo "(no dist dir)"
          echo "--- any index.html anywhere ---"
          find . -maxdepth 5 -iname "index.html" -not -path "*/node_modules/*" 2>/dev/null || echo "(none found)"

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\
              <uses-permission android:name="android.permission.READ_SMS" />\
              <uses-permission android:name="android.permission.RECEIVE_SMS" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />\
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\
              <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          cat "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vairagya-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
